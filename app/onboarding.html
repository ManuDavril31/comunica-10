---
layout: app
title: "Bienvenido a Comunica 10"
hide_nav: true
hide_header: true
---

<div id="onboarding-flow" style="display: flex; flex-direction: column; min-height: 80vh; justify-content: space-between; padding-top: 16px;">
  <!-- Barra de progreso superior -->
  <div style="margin-bottom: 24px;">
    <div class="flex justify-between items-center text-xs text-muted" style="margin-bottom: 8px;">
      <span id="step-counter-label">Paso 1 de 4</span>
      <span class="badge badge-primary">Onboarding</span>
    </div>
    <div class="progress-track">
      <div id="onboarding-progress-bar" class="progress-fill" style="width: 25%;"></div>
    </div>
  </div>

  <!-- Contenedor dinámico de pasos -->
  <div id="step-content-area" class="animate-fade-in" style="flex: 1;">
    <!-- Renderizado dinámico vía JS -->
  </div>

  <!-- Botones de navegación de pasos -->
  <div style="margin-top: 24px; display: flex; gap: 12px;">
    <button id="btn-onboarding-back" class="btn btn-secondary" style="display: none; width: 35%;">
      Atrás
    </button>
    <button id="btn-onboarding-next" class="btn btn-primary btn-block" style="flex: 1;">
      Continuar
    </button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  let currentStep = 1;
  const userChoices = {
    goal: 'hablar-camara',
    level: 0,
    time: '5min'
  };

  const stepsData = [
    {
      step: 1,
      title: "¿Qué quieres conseguir?",
      subtitle: "Personalizaremos tus ejercicios según tu objetivo principal.",
      options: [
        { id: "perder-miedo", title: "Perder el miedo a hablar", desc: "Dejar de paralizarme y sentirme cómodo al mirar al lente." },
        { id: "hablar-camara", title: "Hablar con soltura frente a cámara", desc: "Grabar vídeos naturales para reuniones o redes." },
        { id: "improvisacion", title: "Mejorar mi improvisación", desc: "Responder con firmeza preguntas sorpresa sin dudar." },
        { id: "crear-contenido", title: "Crear contenido para redes", desc: "Hablar fluido en TikTok, Reels, YouTube o LinkedIn." }
      ],
      selected: "hablar-camara"
    },
    {
      step: 2,
      title: "¿Cuál es tu nivel actual?",
      subtitle: "Sé sincero; el gimnasio te llevará paso a paso.",
      options: [
        { id: "principiante", level: 0, title: "Principiante", desc: "Me bloqueo con facilidad y evito encender la cámara." },
        { id: "intermedio", level: 1, title: "Intermedio", desc: "Puedo hablar pero uso muchas muletillas y me desvío." },
        { id: "avanzado", level: 2, title: "Avanzado", desc: "Tengo soltura pero quiero dominar persuasión y storytelling." }
      ],
      selected: "principiante"
    },
    {
      step: 3,
      title: "¿Cuánto tiempo puedes practicar?",
      subtitle: "La consistencia de 5 minutos diarios supera horas esporádicas.",
      options: [
        { id: "5min", title: "5 minutos al día", desc: "1 ejercicio diario — Ideal para arrancar el hábito." },
        { id: "10min", title: "10 minutos al día", desc: "2 misiones con repetición de mejora." },
        { id: "15min", title: "15 minutos al día", desc: "Entrenamiento intensivo de oratoria." }
      ],
      selected: "5min"
    },
    {
      step: 4,
      title: "¡Tu entrenamiento está listo!",
      subtitle: "Menos teoría, más práctica. Tu primera misión de desbloqueo te espera en el Nivel 0.",
      isFinal: true
    }
  ];

  const renderStep = () => {
    const data = stepsData[currentStep - 1];
    const container = document.getElementById('step-content-area');
    const progressBar = document.getElementById('onboarding-progress-bar');
    const stepLabel = document.getElementById('step-counter-label');
    const backBtn = document.getElementById('btn-onboarding-back');
    const nextBtn = document.getElementById('btn-onboarding-next');

    // Actualizar progreso
    progressBar.style.width = `${(currentStep / 4) * 100}%`;
    stepLabel.textContent = `Paso ${currentStep} de 4`;

    backBtn.style.display = currentStep > 1 ? 'inline-flex' : 'none';

    if (data.isFinal) {
      nextBtn.textContent = 'EMPEZAR NIVEL 0 🚀';
      container.innerHTML = `
        <div class="text-center" style="padding-top: 30px;">
          <div style="font-size: 4rem; margin-bottom: 16px;">🎯</div>
          <h2 style="margin-bottom: 12px;">${data.title}</h2>
          <p style="margin-bottom: 24px; color: #cbd5e1;">${data.subtitle}</p>

          <div class="card" style="text-align: left; background: rgba(99, 102, 241, 0.1); border-color: var(--border-accent);">
            <h4 style="color: #fff; margin-bottom: 8px;">Misión #1: Desbloquear la voz</h4>
            <p class="text-sm">Presentarte: di tu nombre, de dónde eres y qué te motivó hoy.</p>
            <div class="flex justify-between items-center text-xs text-muted" style="margin-top: 12px;">
              <span>Preparación: 15s</span>
              <span>Duración: 45s</span>
            </div>
          </div>
        </div>
      `;
      return;
    }

    nextBtn.textContent = 'Continuar';
    let optionsHtml = '';
    data.options.forEach(opt => {
      const isSelected = data.selected === opt.id;
      optionsHtml += `
        <div class="selectable-option-card ${isSelected ? 'selected' : ''}" data-id="${opt.id}">
          <div class="option-radio-indicator"></div>
          <div>
            <div style="font-weight: 700; color: #fff; margin-bottom: 2px;">${opt.title}</div>
            <div class="text-xs text-muted">${opt.desc}</div>
          </div>
        </div>
      `;
    });

    container.innerHTML = `
      <div>
        <h2 style="margin-bottom: 8px;">${data.title}</h2>
        <p class="text-sm" style="margin-bottom: 20px;">${data.subtitle}</p>
        <div class="option-cards-list">
          ${optionsHtml}
        </div>
      </div>
    `;

    // Listeners para selección
    container.querySelectorAll('.selectable-option-card').forEach(card => {
      card.addEventListener('click', () => {
        container.querySelectorAll('.selectable-option-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        data.selected = card.dataset.id;
        if (currentStep === 1) userChoices.goal = card.dataset.id;
        if (currentStep === 2) userChoices.level = card.dataset.id === 'principiante' ? 0 : (card.dataset.id === 'intermedio' ? 1 : 2);
        if (currentStep === 3) userChoices.time = card.dataset.id;
      });
    });
  };

  document.getElementById('btn-onboarding-back').addEventListener('click', () => {
    if (currentStep > 1) {
      currentStep--;
      renderStep();
    }
  });

  document.getElementById('btn-onboarding-next').addEventListener('click', () => {
    if (currentStep < 4) {
      currentStep++;
      renderStep();
    } else {
      // Guardar preferencias en Storage
      Storage.updateUser({
        goal: userChoices.goal,
        level: userChoices.level,
        dailyTime: userChoices.time,
        onboardingCompleted: true
      });
      // Ir a la primera misión o al dashboard
      window.location.href = 'mission.html?id=1';
    }
  });

  renderStep();
});
</script>
