# Banco de ejercicios y misiones de Comunica 10

- id: 1
  level: 0
  category: "desbloqueo"
  prompt: "Preséntate: di tu nombre, de dónde eres y qué te motivó a empezar a entrenar hoy."
  preparationTime: 15
  targetTime: 45
  difficulty: 1
  skills: ["Presencia", "Naturalidad"]
  instructions: "No intentes sonar profesional ni perfecto. Habla exactamente como si le enviaras una videonota a un amigo íntimo."
  successCriteria:
    - "Mirar al lente de la cámara"
    - "Hablar sin detener el vídeo a mitad de camino"
    - "Sonreír al menos una vez"
  coachingTip: "El lente es tu amigo. Imagina que detrás de él hay alguien que quiere escucharte."

- id: 2
  level: 0
  category: "desbloqueo"
  prompt: "Describe tu habitación o el espacio donde estás en este momento."
  preparationTime: 10
  targetTime: 45
  difficulty: 1
  skills: ["Naturalidad", "Fluidez"]
  instructions: "Mira alrededor. Describe 3 objetos que veas y explica por qué están ahí o qué significan para ti."
  successCriteria:
    - "No pausar más de 3 segundos consecutivos"
    - "Utilizar descripciones sensoriales (colores, formas)"
  coachingTip: "Cuando describes cosas físicas reales, tu mente no tiene que inventar nada y se reduce la ansiedad."

- id: 3
  level: 0
  category: "desbloqueo"
  prompt: "¿Cuál es tu comida favorita de todos los tiempos y por qué?"
  preparationTime: 15
  targetTime: 45
  difficulty: 1
  skills: ["Naturalidad", "Emoción"]
  instructions: "Transmite entusiasmo. ¿Quién la cocina? ¿A qué sabe? Haz que a quien te escucha se le haga la boca agua."
  successCriteria:
    - "Transmitir emoción con el tono de voz"
    - "Completar los 45 segundos sin apagar la cámara"
  coachingTip: "La pasión por un tema sencillo relaja las cuerdas vocales y elimina la rigidez corporal."

- id: 4
  level: 1
  category: "fluidez"
  prompt: "Cuenta qué fue lo primero que hiciste hoy al levantarte y cómo empezó tu día."
  preparationTime: 15
  targetTime: 30
  difficulty: 1
  skills: ["Fluidez", "Control del bloqueo"]
  instructions: "Mantén una única línea de tiempo. No saltes de tema. 30 segundos continuos de relato cronológico."
  successCriteria:
    - "No abandonar la grabación antes de los 30 segundos"
    - "Mantener un ritmo respiratorio estable"
  coachingTip: "Si te trabas con una palabra, continúa con otra. Nunca pidas disculpas en la grabación."

- id: 5
  level: 1
  category: "fluidez"
  prompt: "Explica una costumbre o rutina que tengas todos los días y no te guste saltarte."
  preparationTime: 15
  targetTime: 30
  difficulty: 1
  skills: ["Fluidez", "Claridad"]
  instructions: "Concéntrate en sostener la idea fija durante los 30 segundos completos."
  successCriteria:
    - "Llegar a la campana de los 30s sin cortar"
    - "Cerrar con una frase final"
  coachingTip: "30 segundos pasan muy rápido cuando tienes un objetivo claro en mente."

- id: 6
  level: 2
  category: "estructura"
  prompt: "Explica una habilidad o lección que hayas aprendido durante este último año."
  preparationTime: 15
  targetTime: 60
  difficulty: 2
  skills: ["Estructura", "Fluidez", "Claridad"]
  instructions: "Usa 3 momentos: 1) Qué aprendiste, 2) Cómo lo aprendiste, 3) Cómo te sirve hoy en día."
  successCriteria:
    - "Estructurar en Inicio, Desarrollo y Conclusión"
    - "Duración entre 50 y 65 segundos"
  coachingTip: "Un minuto requiere ritmo: 15s de introducción, 35s de desarrollo y 10s de cierre contundente."

- id: 7
  level: 2
  category: "claridad"
  prompt: "¿Cuál es tu película o libro preferido y por qué todo el mundo debería conocerlo?"
  preparationTime: 15
  targetTime: 60
  difficulty: 2
  skills: ["Claridad", "Estructura"]
  instructions: "No cuentes todo el argumento. Di de qué trata en una frase y da dos razones para recomendarlo."
  successCriteria:
    - "Evitar spoilers largos"
    - "Rematar con una recomendación clara"
  coachingTip: "Sintetizar es el músculo del comunicador moderno."

- id: 8
  level: 3
  category: "muletillas"
  prompt: "Explica cómo llegar desde tu casa al lugar de trabajo o estudio, o tu viaje favorito."
  preparationTime: 10
  targetTime: 60
  difficulty: 2
  skills: ["Pausas", "Control de muletillas"]
  instructions: "MISIÓN ESPECIAL: Cada vez que sientas que vas a decir 'ehhh', 'este' u 'o sea', CIERRA la boca y haz una pausa de 1 segundo."
  successCriteria:
    - "Menos de 4 muletillas en 1 minuto"
    - "Al menos 3 pausas silenciosas conscientes"
  coachingTip: "El silencio transmite seguridad y control. La muletilla transmite angustia por rellenar el aire."

- id: 9
  level: 3
  category: "muletillas"
  prompt: "El poder del silencio: Explica qué ventajas tiene levantarse temprano o trasnochar."
  preparationTime: 10
  targetTime: 60
  difficulty: 2
  skills: ["Pausas", "Control de muletillas"]
  instructions: "Respira antes de empezar cada nueva oración. Deja que los puntos y comas se conviertan en silencio puro."
  successCriteria:
    - "Sustituir al menos 5 posibles muletillas por pausas limpias"
  coachingTip: "Para tu cerebro la pausa parece de 10 segundos, pero para el oyente apenas es un segundo elegante."

- id: 10
  level: 4
  category: "estructura"
  prompt: "Aplica PREP: ¿Debería la gente leer más libros de no ficción o novelas?"
  preparationTime: 20
  targetTime: 90
  difficulty: 3
  skills: ["Estructura", "Argumentación", "Claridad"]
  instructions: "Sigue la estructura: P (Punto central), R (Razón de peso), E (Ejemplo de tu vida), P (Reafirmación del punto)."
  successCriteria:
    - "Identificar claramente cada una de las 4 fases de PREP"
    - "Cerrar volviendo a la tesis inicial"
  coachingTip: "PREP te salva la vida en reuniones de trabajo y respuestas en directo."

- id: 11
  level: 4
  category: "estructura"
  prompt: "Problema → Causa → Solución: ¿Por qué nos cuesta tanto gestionar el tiempo con el móvil?"
  preparationTime: 20
  targetTime: 90
  difficulty: 3
  skills: ["Estructura", "Claridad"]
  instructions: "Define el problema en 20s, analiza la causa real en 35s y propón una solución práctica en 35s."
  successCriteria:
    - "Transiciones explícitas entre problema, causa y solución"
  coachingTip: "Usa conectores como 'El problema fundamental es...', 'Esto sucede porque...' y 'La forma de resolverlo es...'."

- id: 12
  level: 5
  category: "resistencia"
  prompt: "Desarrolla una minicharla: ¿Por qué la curiosidad es más importante que el talento?"
  preparationTime: 30
  targetTime: 180
  difficulty: 3
  skills: ["Fluidez", "Estructura", "Presencia"]
  instructions: "Tienes 3 minutos completos. Organiza: Anécdota de apertura (45s), 2 argumentos principales (90s) y llamada a la acción (45s)."
  successCriteria:
    - "No perder el hilo conductor durante los 3 minutos"
    - "Mantener la energía alta en el último minuto"
  coachingTip: "En discursos largos, modula el volumen y la velocidad para que la audiencia no se duerma."

- id: 13
  level: 6
  category: "improvisacion"
  prompt: "¿Qué impacto real crees que tendrá la inteligencia artificial en el trabajo de los próximos 5 años?"
  preparationTime: 5
  targetTime: 60
  difficulty: 4
  skills: ["Improvisación", "Pensamiento rápido", "Fluidez"]
  instructions: "Solo tienes 5 segundos de preparación. No escribas nada. Comienza con una opinión rotunda y defiéndela."
  successCriteria:
    - "Empezar a hablar antes del segundo 6"
    - "No quedarse callado más de 3 segundos al inicio"
  coachingTip: "No busques la respuesta más sabia del mundo; busca tu verdad inmediata y arranca."

- id: 14
  level: 6
  category: "improvisacion"
  prompt: "Si pudieras cenar con cualquier personaje de la historia, ¿a quién elegirías y qué le preguntarías?"
  preparationTime: 5
  targetTime: 60
  difficulty: 4
  skills: ["Improvisación", "Creatividad"]
  instructions: "Elige la primera persona que te venga a la mente. No cambies de opinión."
  successCriteria:
    - "Decisión rápida e inmediata"
    - "Justificación coherente sobre la marcha"
  coachingTip: "La duda mata la improvisación. Confía en tu primer impulso."

- id: 15
  level: 7
  category: "camara"
  prompt: "Vende tu rincón favorito de tu ciudad mirando fijamente al lente con energía positiva."
  preparationTime: 15
  targetTime: 60
  difficulty: 3
  skills: ["Presencia", "Lenguaje corporal", "Conexión visual"]
  instructions: "Coloca la cámara a la altura de tus ojos. Mantén contacto visual del 90% con el lente, gesticula con soltura."
  successCriteria:
    - "No desviar la mirada hacia la pantalla ni hacia abajo"
    - "Manos visibles en el encuadre apoyando tus palabras"
  coachingTip: "Pon una pequeña marca adhesiva o dibuja una cara feliz junto al lente de tu cámara para recordarte mirar ahí."

- id: 16
  level: 8
  category: "storytelling"
  prompt: "Cuenta una anécdota vergonzosa o divertida que te haya ocurrido y de la que hoy te rías."
  preparationTime: 20
  targetTime: 120
  difficulty: 4
  skills: ["Storytelling", "Emoción", "Estructura"]
  instructions: "Aplica la curva narrativa: Gancho ('Nunca olvidaré el día en que...'), tensión y desenlace cómico."
  successCriteria:
    - "Gancho en los primeros 10 segundos"
    - "Crear un momento de suspenso o clímax"
    - "Conclusión con autorreflexión"
  coachingTip: "La vulnerabilidad compartida es el pegamento más potente entre un orador y su audiencia."

- id: 17
  level: 2
  category: "fluidez"
  prompt: "Misión del día: Habla durante 60 segundos sobre el mejor consejo que has recibido en tu vida."
  preparationTime: 15
  targetTime: 60
  difficulty: 2
  skills: ["Fluidez", "Estructura", "Naturalidad"]
  instructions: "Di quién te lo dio, en qué momento de tu vida fue y cómo cambió tu forma de actuar."
  successCriteria:
    - "Mantener la respuesta concentrada en 1 solo consejo"
    - "Concluir en torno al minuto"
  coachingTip: "Usa detalles personales: el lugar, la voz de quien te lo dijo. Los detalles dan vida al consejo."

- id: 18
  level: 8
  category: "storytelling"
  prompt: "Cuenta un fracaso o error profesional/personal del que hayas extraído tu mayor aprendizaje."
  preparationTime: 20
  targetTime: 120
  difficulty: 4
  skills: ["Storytelling", "Claridad", "Estructura"]
  instructions: "No endulces el error. Sé honesto sobre lo que sentiste y muestra el aprendizaje concreto que te dejó."
  successCriteria:
    - "Estructura Antes → Error → Consecuencia → Aprendizaje"
  coachingTip: "Un fracaso bien contado vale más que diez victorias presumidas."

- id: 19
  level: 9
  category: "persuasion"
  prompt: "Convence a alguien escéptico de por qué debería hacer ejercicio físico al menos 3 veces por semana."
  preparationTime: 25
  targetTime: 120
  difficulty: 4
  skills: ["Persuasión", "Argumentación"]
  instructions: "Anticípate a su excusa principal ('no tengo tiempo') y refútala con empatía antes de plantear tu argumento."
  successCriteria:
    - "Reconocer la objeción del interlocutor"
    - "Ofrecer un primer paso ridículamente fácil"
  coachingTip: "No persigas tener la razón; busca que la otra persona quiera probarlo por sí misma."

- id: 20
  level: 10
  category: "maestria"
  prompt: "Reto Cumbre: 10 minutos de discurso espontáneo sobre 'El valor de la disciplina vs la motivación'."
  preparationTime: 30
  targetTime: 600
  difficulty: 5
  skills: ["Maestría Integral", "Improvisación", "Storytelling", "Estructura", "Presencia"]
  instructions: "La prueba final de Comunica 10. Desarrolla conceptos, cuenta al menos dos historias, haz pausas magistrales y cierra con una llamada inolvidable."
  successCriteria:
    - "Mantener el hilo durante 10 minutos sin detenerse"
    - "Menos de 5 muletillas por minuto promedio"
    - "Cambios de ritmo y entonación conscientes"
  coachingTip: "Respira hondo. Estás listo para este nivel. Disfruta del viaje."

- id: 101
  level: 6
  category: "sorpresa"
  prompt: "¿Qué harías si en los primeros 30 segundos de una presentación clave se apaga la pantalla por completo?"
  preparationTime: 5
  targetTime: 60
  difficulty: 3
  skills: ["Improvisación", "Calma bajo presión", "Presencia"]
  instructions: "No tienes diapositivas. Mira a la cámara con tranquilidad y explica a tu audiencia cómo continuarás sin dudar."
  successCriteria:
    - "Arrancar en menos de 5 segundos"
    - "Mostrar seguridad en la voz"
    - "Proponer una solución inmediata"
  coachingTip: "La audiencia no juzga el fallo técnico; juzga tu templanza ante él."

- id: 102
  level: 6
  category: "sorpresa"
  prompt: "Explícale a un niño de 7 años en qué consiste tu trabajo o tu pasión sin usar palabras técnicas."
  preparationTime: 5
  targetTime: 60
  difficulty: 3
  skills: ["Claridad", "Analogías", "Naturalidad"]
  instructions: "Usa metáforas cotidianas (juguetes, superhéroes, comida). Si usas palabras complejas, pierdes la atención."
  successCriteria:
    - "Lenguaje 100% accesible"
    - "Sonreír y gesticular con calidez"
    - "Analogía concreta"
  coachingTip: "Si no puedes explicárselo a un niño, todavía no lo dominas con sencillez."

- id: 103
  level: 6
  category: "sorpresa"
  prompt: "Si pudieras cenar hoy con cualquier personaje histórico (vivo o muerto), ¿a quién elegirías y qué le preguntarías?"
  preparationTime: 5
  targetTime: 60
  difficulty: 2
  skills: ["Espontaneidad", "Storytelling", "Estructura"]
  instructions: "Di el nombre en menos de 5 segundos, da el motivo en 20 segundos y formula la gran pregunta que le harías."
  successCriteria:
    - "Respuesta inmediata"
    - "Razón convincente"
    - "Pregunta memorable"
  coachingTip: "No busques la respuesta más 'culta'; busca la que despierte tu curiosidad genuina."

- id: 104
  level: 6
  category: "sorpresa"
  prompt: "¿Cuál es una verdad incómoda sobre tu profesión o sector que casi nadie se atreve a decir en voz alta?"
  preparationTime: 5
  targetTime: 60
  difficulty: 4
  skills: ["Persuasión", "Autoridad", "Fluidez"]
  instructions: "Plantea la verdad de golpe. Explica por qué se oculta y cuál es la solución constructiva."
  successCriteria:
    - "Tesis firme en los primeros 15s"
    - "Tono profesional y constructivo"
  coachingTip: "La franqueza respetuosa genera 10 veces más credibilidad que el discurso corporativo estándar."

- id: 105
  level: 6
  category: "sorpresa"
  prompt: "Tienes 60 segundos en televisión nacional para convencer a millones de adoptar un solo hábito diario. ¿Cuál es?"
  preparationTime: 5
  targetTime: 60
  difficulty: 3
  skills: ["Persuasión", "Energía", "Estructura PREP"]
  instructions: "Llamada a la acción urgente y directa. ¿Por qué ese hábito específico cambiará sus vidas?"
  successCriteria:
    - "Gancho inicial enérgico"
    - "Beneficio tangible inmediato"
  coachingTip: "Habla con convicción física: postura erguida, mirada al lente, voz firme."

